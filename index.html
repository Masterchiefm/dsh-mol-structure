<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh-mol-structure · IscB–ωRNA–target DNA (PDB 7XHT)</title>
    <link rel="stylesheet" href="./molstar.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        /* Mol* mounts its full UI inside #app; panels are disabled via options. */
        #app {
            position: absolute;
            inset: 0;
        }

        /* Floating control card (plain HTML, independent of the Mol* UI).
           Anchored to the same corner as its toggle chip so opening it is not a
           jump across the screen. Content is built dynamically in main.js. */
        .control-card {
            position: fixed;
            right: 12px;
            bottom: 44px;
            z-index: 10;
            background: #ffffff;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            padding: 8px 12px 10px;
            font-size: 12px;
            color: #333;
            max-width: 300px;
            max-height: calc(100% - 110px);
            overflow: auto;
        }

        .control-card .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 2px;
        }

        .control-card .card-head h1 {
            margin: 0;
        }

        #btn-card-close {
            font: inherit;
            font-size: 14px;
            line-height: 1;
            width: 20px;
            height: 20px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(128, 128, 128, 0.35);
            background: transparent;
            color: #555;
            border-radius: 5px;
            cursor: pointer;
            padding: 0;
        }

        #btn-card-close:hover {
            background: #f2f2f2;
            color: #111;
        }

        /* embedded mode starts collapsed; the chip brings the panel back.
           Bottom-right: the top-right corner belongs to Mol*'s own controls. */
        .control-card.collapsed {
            display: none;
        }

        #btn-card-toggle {
            position: fixed;
            bottom: 12px;
            right: 12px;
            z-index: 10;
            font: inherit;
            font-size: 12px;
            border: 1px solid rgba(128, 128, 128, 0.45);
            background: rgba(255, 255, 255, 0.92);
            color: #333;
            border-radius: 6px;
            padding: 3px 9px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        #btn-card-toggle:hover {
            background: #e6f0ff;
        }

        #btn-card-toggle.hidden {
            display: none;
        }

        #custom-panel-group .btn-row button {
            border-color: #7aa7d9;
            background: #f0f6ff;
        }

        .control-card h1 {
            font-size: 13px;
            margin: 0 0 4px 0;
        }

        .control-card .caption {
            margin: 2px 0 8px 0;
            color: #666;
            line-height: 1.4;
        }

        .control-card .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .control-card .group-title {
            font-size: 11px;
            color: #888;
            margin: 8px 0 4px 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
        }

        .control-card .paper-title {
            font-size: 12px;
            font-weight: 700;
            color: #333;
            margin: 10px 0 2px 0;
        }

        .control-card button {
            font: inherit;
            border: 1px solid #c4c4c4;
            background: #f5f5f5;
            border-radius: 5px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .control-card button:hover {
            background: #e6f0ff;
            border-color: #4a7ebb;
        }

        .control-card button.active {
            background: #4a7ebb;
            border-color: #35618c;
            color: #fff;
        }

        #status {
            margin-top: 8px;
            color: #888;
            min-height: 1em;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <button id="btn-card-toggle" title="显示 / 隐藏视图控制卡">☰ 视图</button>
    <div class="control-card">
        <div class="card-head">
            <h1>结构视图控制</h1>
            <button id="btn-card-close" title="关闭面板" aria-label="关闭面板">×</button>
        </div>
        <div class="group-title">视图</div>
        <div class="btn-row" id="view-buttons"></div>
        <div class="group-title">自定义视图（对话中可注册 / 修改）</div>
        <div class="btn-row" id="custom-row">
            <span style="color:#888">尚未注册 — 对话里说“注册一个视图”即可（mol_panel_define）</span>
        </div>
        <div class="group-title">自定义操作（对话中可注册 / 修改）</div>
        <div class="btn-row" id="action-row">
            <span style="color:#888">尚未注册 — 对话里说“注册一组操作按钮”即可</span>
        </div>
        <div id="paper-panels" hidden>
            <div class="group-title">论文复现面板（内置示例）</div>
            <div class="btn-row" data-figures="fig1b,fig1c,fig1cBack,fig2,fig3bA,fig3bB,fig3c,fig4a,fig4aBack,fig4c,fig4d,fig4e,c1ov,c1ovBack,c1d,c2a,c2d,c2f"></div>
        </div>
        <div class="btn-row" style="margin-top:8px">
            <button id="btn-reload-view" title="重建当前视图并强制重绘（从后台切回后画面空白时用）">重载视图</button>
            <button id="btn-mode" title="开启完整 Mol* 界面：左侧控制树、序列、截图/动画工具栏">完整 Mol*</button>
            <button id="btn-labels" title="显示 / 隐藏全部标注（引线标签）">标签：开</button>
            <button id="btn-pick-center" title="点击任意残基，把视角中心移到它（保持当前缩放）；也可直接 Shift+点击">点击定中心</button>
            <button id="btn-center-structure" title="把视角中心移回整个结构的中心">回到结构中心</button>
            <button id="btn-rotate" title="Rotate camera around the vertical axis by 45°">Rotate 45°</button>
            <button id="btn-export" title="Download a 4× PNG of the current viewport (canvas only)">Export PNG ×4</button>
        </div>
        <div id="status">loading…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
